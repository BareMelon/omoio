[package]
name = "omoio"
version = "0.1.0"
description = "PS3 game library and launcher for RPCS3"
authors = ["Bertram Bech"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
name = "omoio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
windows = { version = "0.62", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
sevenz-rust2 = "0.22"
zip = "4"
tokio = { version = "1", features = ["fs", "io-util"] }
futures-util = "0.3"
sha2 = "0.11"
# RPCS3's patch file is real YAML: anchors, aliases, and the same key repeated
# at the top level. Only used to read it; our own files keep the small writer
# in game_config.rs.
yaml-rust2 = "0.10"
# All three are already in the build as dependencies of something else, so
# naming them here adds no new code. Sony's update manifest is XML, its
# packages are checksummed with SHA-1, and reaching the manifest needs a
# certificate check of our own. See updates.rs.
quick-xml = "0.41"
sha1 = "0.10"
rustls = { version = "0.23", default-features = false }
# Reads which gamepads are plugged in, so the profile Omoio writes for the
# emulator names the controller that is actually there. Pure Rust, no DLL to
# ship. See backends/rpcs3/controllers.rs.
gilrs = "0.11"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
