<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Downloads · Omoio</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b0e14">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/stats.js" defer></script>
</head>
<body>
  <main>
    <section class="hero stats">
      <img class="app-icon" src="/favicon.svg" width="88" height="88" alt="">
      <h1 id="total">…</h1>
      <p class="lede">installer downloads, every version</p>
      <p id="updated" class="meta">Asking GitHub</p>

      <table id="releases" class="releases" hidden>
        <thead>
          <tr><th>Version</th><th>Released</th><th>Downloads</th></tr>
        </thead>
        <tbody></tbody>
      </table>

      <button id="refresh" class="download" type="button">Refresh</button>
      <p class="note">Every download of the installer counts: from omoio.app, from GitHub, and from copies of Omoio updating themselves. Your own downloads count too.</p>
    </section>
  </main>
</body>
</html>
